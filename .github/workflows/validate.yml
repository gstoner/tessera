name: Validate

# Five lanes, separately reported so branch protection can require the
# portable gates (lint / unit / audit) without blocking on optional work
# (lit / sanitizer). See .github/BRANCH_PROTECTION.md for the recommended
# required-check list. The runtime/collectives build and the ROCm compiler
# suite are intentionally local-only (too heavy / mirror-dependent for
# hosted runners) — scripts/validate.sh owns them.
#
# Mirrors scripts/validate.sh exactly — the local validation spine is
# the source of truth.  When you add a step there, add a lane (or
# extend one) here.

permissions:
  contents: read

# PRs are the gate (pull_request runs the merge-result commit once). push runs
# only on main as a post-merge safety net — this avoids the double run a PR'd
# branch otherwise pays (push and pull_request fire on different refs, so the
# concurrency group below cannot dedupe them). Pre-PR CI on a branch: open a
# draft PR.
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  # Tessera is torch-free at runtime (Decision #23); CI installs the
  # tight set of deps that the unit-test suite actually touches so a
  # fresh runner doesn't pull the full transformers stack.
  TESSERA_CI_PY_DEPS: >-
    numpy>=1.21.0,<2.0.0
    pytest>=7.0.0
    pytest-cov>=4.0.0
    pytest-xdist>=3.0.0
    pytest-timeout>=2.1.0
    hypothesis>=6.0.0
    pyyaml>=6.0.0
    click>=8.0.0
    rich>=12.0.0
    tqdm>=4.64.0
    scipy>=1.9.0
    matplotlib>=3.5.0
    ml_dtypes>=0.4.0
    ruff>=0.6.0
    mypy>=1.11.0

jobs:
  # ────────────────────────────────────────────────────────────────────
  # Lane 1 — lint  (ruff + mypy ratchet)   ~30s
  # Required check.
  # ────────────────────────────────────────────────────────────────────
  lint:
    name: lint (ruff + mypy ratchet)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install lint deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . --no-deps
          # shellcheck disable=SC2086
          python -m pip install $TESSERA_CI_PY_DEPS

      - name: ruff check
        run: python -m ruff check python/tessera/

      - name: mypy ratchet (defends 0 under check_untyped_defs=true)
        env:
          MYPY: python -m mypy
        run: bash scripts/mypy_ratchet.sh

  # ────────────────────────────────────────────────────────────────────
  # Lane 2 — unit  (pytest -m "not slow")
  # Required check. Runs xdist-parallel (`-n auto`) across the runner's
  # cores; the pathologically-slow tests (20–300s each — fixture-verify CLI,
  # mypy/ruff baselines, generated-doc drift gates) are marked `slow` so they
  # don't straggle this lane — their coverage lives in the `lint` + `audit`
  # lanes that run the same checks (see each test's skip rationale).
  # ────────────────────────────────────────────────────────────────────
  unit:
    name: unit (pytest -m "not slow")
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install unit-test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . --no-deps
          # shellcheck disable=SC2086
          python -m pip install $TESSERA_CI_PY_DEPS

      - name: pytest (CPU lane, not slow)
        env:
          PYTHONPATH: python
        # -n auto: parallelize across the runner's cores (xdist). --timeout: a
        # hung test fails loudly instead of eating the 20-min budget (also
        # silences the "Unknown config option: timeout" warning — the config
        # expected pytest-timeout, now installed).
        run: >-
          python -m pytest tests/unit -q
          -m "not slow and not performance and not hardware_apple_gpu and not hardware_nvidia and not hardware_rocm and not hardware_amx"
          -n auto --timeout=180

  # ────────────────────────────────────────────────────────────────────
  # Lane 3 — audit  (support_table drift + claim_lint + examples)   ~10s
  # Required check.
  # ────────────────────────────────────────────────────────────────────
  audit:
    name: audit (drift + claim_lint + examples)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install audit deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . --no-deps
          # shellcheck disable=SC2086
          python -m pip install $TESSERA_CI_PY_DEPS

      - name: Generated audit-doc drift checks
        env:
          PYTHONPATH: python
        run: bash scripts/check_generated_docs.sh

      - name: Public-doc claim_lint
        env:
          PYTHONPATH: python
        run: python -m tessera.compiler.audit claim_lint

      # Five-surface audit (examples / benchmarks / research / tools / tests).
      # Each surface declares its entry points in
      # python/tessera/compiler/<surface>_manifest.py.  Drift gates on
      # the generated dashboards live in tests/unit/test_surface_audit.py
      # (run in the `unit` lane).  These steps execute the runnable
      # rows + check for README overclaim language.
      - name: Surface audit (examples)
        env:
          PYTHONPATH: python
        run: python -m tessera.cli.surface_audit --surface=examples --check

      - name: Surface audit (benchmarks)
        env:
          PYTHONPATH: python
        run: python -m tessera.cli.surface_audit --surface=benchmarks --check

      - name: Surface audit (research)
        env:
          PYTHONPATH: python
        run: python -m tessera.cli.surface_audit --surface=research --check

      - name: Surface audit (tools)
        env:
          PYTHONPATH: python
        run: python -m tessera.cli.surface_audit --surface=tools --check

      - name: Surface audit (tests)
        env:
          PYTHONPATH: python
        run: python -m tessera.cli.surface_audit --surface=tests --check

      - name: Surface README claim_lint (all surfaces)
        env:
          PYTHONPATH: python
        run: python -m tessera.cli.claim_lint --check

  # ────────────────────────────────────────────────────────────────────
  # Lane 4 — lit  (MLIR FileCheck)   ~30s once MLIR is available
  # Opt-in.  Not required.
  #
  # Stock GitHub-hosted Ubuntu doesn't carry MLIR 23, so the lane
  # installs it via apt.llvm.org and gracefully skips if the install
  # fails.  When MLIR 23 lands in the runner image, drop the install
  # guard.
  # ────────────────────────────────────────────────────────────────────
  lit:
    name: lit (MLIR FileCheck — opt-in)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Only run on PRs labeled `lit-smoke`, on manual dispatch, or on
    # pushes to main.  Keeps the critical path fast.
    if: >-
      (github.event_name == 'workflow_dispatch')
      || (github.event_name == 'pull_request'
          && contains(github.event.pull_request.labels.*.name, 'lit-smoke'))
      || (github.event_name == 'push'
          && (github.ref == 'refs/heads/main'
              || github.ref == 'refs/heads/master'))
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install system deps + LLVM/MLIR 23
        id: deps
        run: |
          # Drop the runner's flaky pre-installed Microsoft apt repos (see above).
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list \
                     /etc/apt/sources.list.d/azure-cli.list \
                     /etc/apt/sources.list.d/azure-cli.sources 2>/dev/null || true
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build wget gnupg
          # Try the official LLVM apt repo for LLVM 23. Tessera rejects
          # older or mixed-major toolchains during configure.
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add - || true
          codename="$(lsb_release -cs)"
          echo "deb http://apt.llvm.org/${codename}/ llvm-toolchain-${codename}-23 main" \
            | sudo tee /etc/apt/sources.list.d/llvm23.list
          sudo apt-get update || true
          sudo apt-get install -y --no-install-recommends \
            llvm-23-dev mlir-23-tools libmlir-23-dev clang-23 \
            || echo "::warning ::LLVM/MLIR 23 apt install failed (no ${codename}-23 repo yet)"
          # Gate every downstream step on whether the MLIR 23 CMake package
          # actually landed. apt.llvm.org has no LLVM 23 channel for some
          # Ubuntu codenames yet, so the install above may soft-fail; when it
          # does we skip the build/lit steps instead of hard-failing configure.
          if [ -f /usr/lib/llvm-23/lib/cmake/mlir/MLIRConfig.cmake ]; then
            echo "mlir=true" >> "$GITHUB_OUTPUT"
            python -m pip install --upgrade pip
            python -m pip install -e . --no-deps
            # The pytest step below imports `tessera`, which eagerly pulls in
            # stdlib/es.py (-> ml_dtypes). Install the same dep set as every
            # other job instead of a hand-rolled short list, or collection
            # fails before a single MLIR proof test runs.
            # shellcheck disable=SC2086
            python -m pip install $TESSERA_CI_PY_DEPS lit FileCheck
          else
            echo "mlir=false" >> "$GITHUB_OUTPUT"
            echo "::warning ::MLIR 23 CMake package absent — skipping the lit lane build/tests"
          fi

      - name: Configure + build MLIR tools
        if: steps.deps.outputs.mlir == 'true'
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DTESSERA_BUILD_EXAMPLES=ON \
            -DTESSERA_BUILD_APPLE_BACKEND=ON \
            -DTESSERA_BUILD_X86_BACKEND=ON \
            -DMLIR_DIR=/usr/lib/llvm-23/lib/cmake/mlir \
            -DLLVM_DIR=/usr/lib/llvm-23/lib/cmake/llvm
          # The Apple Target-IR dialect + lowering passes are portable MLIR
          # (only the Metal runtime .mm is Darwin-gated; Linux builds the
          # portable C++ stub), so tessera-opt registers the
          # tessera-lower-to-apple_* pipelines and the phase8 Apple lit
          # fixtures run instead of failing on an unregistered pipeline.
          #
          # X86_BACKEND is ON for the same reason: without it `TesseraX86IR`
          # never exists, tessera-opt does not register `tessera_x86`, and every
          # phase2 x86 fixture dies with "Dialect `tessera_x86' not found".
          #
          # ROCM_BACKEND is deliberately NOT set here. On a HIP-less runner
          # `TESSERA_BUILD_ROCM_BACKEND=ON` (with ENABLE_HIP/ENABLE_CUDA off)
          # forces TESSERA_OPT_LEAN_ARTIFACT_DRIVER — see
          # tools/tessera-opt/CMakeLists.txt:95 — which drops core TesseraIR /
          # TesseraPasses AND the x86 Target IR (gated on `NOT lean` at :133).
          # Enabling it here would trade ~12 rocm fixtures for a far larger set
          # of core+x86 failures. The `tessera-ir` rocm_*.mlir fixtures need a
          # separate lean driver or a HIP host; tracked as
          # CI-LIT-BACKEND-DIALECTS-2026-08-12 in docs/audit/backend/rocm/todo.md.
          cmake --build build --target tessera-opt tessera-translate-mlir

      - name: Run MLIR tool proof tests
        if: steps.deps.outputs.mlir == 'true'
        env:
          PYTHONPATH: python
          PATH: "${{ github.workspace }}/build/tools/tessera-opt:${{ github.workspace }}/build/tools/tessera-translate:/usr/lib/llvm-23/bin:${{ env.PATH }}"
          TESSERA_OPT: "${{ github.workspace }}/build/tools/tessera-opt/tessera-opt"
        run: |
          python -m pytest \
            tests/unit/test_cli_translate.py \
            tests/unit/test_tessera_opt_build.py \
            tests/unit/test_scheduled_attention_consumers.py::test_attention_lowers_through_one_content_addressed_tile_artifact \
            tests/unit/test_scheduled_attention_consumers.py::test_attention_modifiers_survive_the_shared_recurrence \
            tests/unit/test_scheduled_attention_consumers.py::test_attention_schedule_policy_tampering_fails_closed \
            -q

      - name: Run lit smoke (TESSERA_VALIDATE_LIT=1)
        if: steps.deps.outputs.mlir == 'true'
        env:
          TESSERA_VALIDATE_LIT: "1"
          PATH: "${{ github.workspace }}/build/tools/tessera-opt:${{ github.workspace }}/build/tools/tessera-translate:/usr/lib/llvm-23/bin:${{ env.PATH }}"
        run: |
          lit tests/tessera-ir -v

  # ────────────────────────────────────────────────────────────────────
  # Lane 5 — sanitizer  (asan / tsan / ubsan smoke)   ~15min
  # Opt-in via PR label `sanitizer-smoke`.  Not required.
  # ────────────────────────────────────────────────────────────────────
  sanitizer:
    name: sanitizer (asan / tsan / ubsan — opt-in)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: >-
      (github.event_name == 'workflow_dispatch')
      || (github.event_name == 'pull_request'
          && contains(github.event.pull_request.labels.*.name, 'sanitizer-smoke'))
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [asan, tsan, ubsan]
    steps:
      - uses: actions/checkout@v5

      - name: Install system deps
        run: |
          # Drop the runner's flaky pre-installed Microsoft apt repos (see above).
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list \
                     /etc/apt/sources.list.d/azure-cli.list \
                     /etc/apt/sources.list.d/azure-cli.sources 2>/dev/null || true
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build

      - name: Run sanitizer smoke (${{ matrix.sanitizer }})
        run: bash scripts/run_sanitizers.sh ${{ matrix.sanitizer }}

  # ────────────────────────────────────────────────────────────────────
  # Aggregator — fan-in for branch protection.
  #
  # Required GitHub status checks accept only job names, so we publish
  # a single "validate-required" check that succeeds iff every required
  # lane succeeded.  Branch protection points at this single name.
  # ────────────────────────────────────────────────────────────────────
  validate-required:
    name: validate-required
    runs-on: ubuntu-latest
    needs: [lint, unit, audit]
    if: always()
    steps:
      - name: Verify required lanes succeeded
        run: |
          # `needs.<job>.result` is "success", "failure", "cancelled", or "skipped".
          # We require every named lane to be "success".
          required=(
            "${{ needs.lint.result }}"
            "${{ needs.unit.result }}"
            "${{ needs.audit.result }}"
          )
          fail=0
          for r in "${required[@]}"; do
            if [ "$r" != "success" ]; then
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "::error ::Required validation lane failed: lint=${{ needs.lint.result }} unit=${{ needs.unit.result }} audit=${{ needs.audit.result }}"
            exit 1
          fi
          echo "All required lanes passed."
