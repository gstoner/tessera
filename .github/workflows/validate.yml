name: Validate

# Five lanes, separately reported so branch protection can require the
# portable gates (lint / unit / audit) without blocking on optional work
# (lit / sanitizer). See .github/BRANCH_PROTECTION.md for the recommended
# required-check list. The runtime/collectives build and the ROCm compiler
# suite are intentionally local-only (too heavy / mirror-dependent for
# hosted runners) — scripts/validate.sh owns them.
#
# Mirrors scripts/validate.sh exactly — the local validation spine is
# the source of truth.  When you add a step there, add a lane (or
# extend one) here.

permissions:
  contents: read

# PRs are the gate (pull_request runs the merge-result commit once). push runs
# only on main as a post-merge safety net — this avoids the double run a PR'd
# branch otherwise pays (push and pull_request fire on different refs, so the
# concurrency group below cannot dedupe them). Pre-PR CI on a branch: open a
# draft PR.
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  # Tessera is torch-free at runtime (Decision #23); CI installs the
  # tight set of deps that the unit-test suite actually touches so a
  # fresh runner doesn't pull the full transformers stack.
  TESSERA_CI_PY_DEPS: >-
    numpy>=1.21.0,<2.0.0
    pytest>=7.0.0
    pytest-cov>=4.0.0
    pytest-xdist>=3.0.0
    pytest-timeout>=2.1.0
    hypothesis>=6.0.0
    pyyaml>=6.0.0
    click>=8.0.0
    rich>=12.0.0
    tqdm>=4.64.0
    scipy>=1.9.0
    matplotlib>=3.5.0
    ml_dtypes>=0.4.0
    ruff>=0.6.0
    mypy>=1.11.0

jobs:
  # ────────────────────────────────────────────────────────────────────
  # Lane 1 — lint  (ruff + mypy ratchet)   ~30s
  # Required check.
  # ────────────────────────────────────────────────────────────────────
  lint:
    name: lint (ruff + mypy ratchet)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install lint deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . --no-deps
          # shellcheck disable=SC2086
          python -m pip install $TESSERA_CI_PY_DEPS

      - name: ruff check
        run: python -m ruff check python/tessera/

      - name: mypy ratchet (defends 0 under check_untyped_defs=true)
        env:
          MYPY: python -m mypy
        run: bash scripts/mypy_ratchet.sh

  # ────────────────────────────────────────────────────────────────────
  # Lane 2 — unit  (pytest -m "not slow")
  # Required check. Runs xdist-parallel (`-n auto`) across the runner's
  # cores; the pathologically-slow tests (20–300s each — fixture-verify CLI,
  # mypy/ruff baselines, generated-doc drift gates) are marked `slow` so they
  # don't straggle this lane — their coverage lives in the `lint` + `audit`
  # lanes that run the same checks (see each test's skip rationale).
  # ────────────────────────────────────────────────────────────────────
  unit:
    name: unit (pytest -m "not slow")
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install unit-test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . --no-deps
          # shellcheck disable=SC2086
          python -m pip install $TESSERA_CI_PY_DEPS

      - name: pytest (CPU lane, not slow)
        env:
          PYTHONPATH: python
        # -n auto: parallelize across the runner's cores (xdist). --timeout: a
        # hung test fails loudly instead of eating the 20-min budget (also
        # silences the "Unknown config option: timeout" warning — the config
        # expected pytest-timeout, now installed).
        run: >-
          python -m pytest tests/unit -q
          -m "not slow and not performance and not compiler_route and not hardware_apple_gpu and not hardware_nvidia and not hardware_rocm and not hardware_amx and not hardware_avx512"
          -n auto --timeout=180

  # ────────────────────────────────────────────────────────────────────
  # Compiler-route structural proof. These tests need a built production
  # tessera-opt and run on a CPU host without claiming owning-device proof.
  # The required lane builds the portable compiler then runs the route proof.
  # ────────────────────────────────────────────────────────────────────
  compiler-route:
    name: compiler route (production tessera-opt)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install system deps and exact LLVM/MLIR 23.1.1
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list \
                     /etc/apt/sources.list.d/azure-cli.list \
                     /etc/apt/sources.list.d/azure-cli.sources 2>/dev/null || true
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build curl xz-utils
          bash scripts/ci_install_pinned_llvm.sh

      - name: Resolve exact LLVM/MLIR 23.1.1 (record or fail)
        run: |
          bash scripts/ci_resolve_llvm.sh --lane compiler-route \
            --manifest ci-toolchain/compiler-route.json

      - name: Install pinned ROCm image SDK (host-free)
        run: bash scripts/ci_install_pinned_rocm.sh

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . --no-deps
          # shellcheck disable=SC2086
          python -m pip install $TESSERA_CI_PY_DEPS

      - name: Configure and build the portable production compiler
        run: |
          cmake -S . -B build-compiler-route \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DTESSERA_BUILD_TESTS=OFF \
            -DTESSERA_BUILD_EXAMPLES=OFF \
            -DTESSERA_BUILD_APPLE_BACKEND=ON \
            -DTESSERA_BUILD_X86_BACKEND=ON \
            -DTESSERA_BUILD_NVIDIA_BACKEND=ON \
            -DTESSERA_BUILD_ROCM_BACKEND=ON \
            -DTESSERA_BUILD_EBM_BACKEND=ON \
            -DTESSERA_BUILD_CLIFFORD_BACKEND=ON \
            -DTESSERA_FORCE_FULL_COMPILER_DRIVER=ON \
            -DTESSERA_ENABLE_CUDA=OFF \
            -DTESSERA_ENABLE_HIP=OFF \
            -DMLIR_DIR="$MLIR_DIR" \
            -DLLVM_DIR="$LLVM_DIR"
          cp build-compiler-route/tessera_llvm_pin.txt ci-toolchain/compiler-route-configure.txt
          cmake --build build-compiler-route --target tessera-opt

      - name: Run compiler-route proof
        env:
          PYTHONPATH: python
          TESSERA_OPT: "${{ github.workspace }}/build-compiler-route/tools/tessera-opt/tessera-opt"
        run: |
          export PATH="$TESSERA_CI_LLVM_PREFIX/bin:$GITHUB_WORKSPACE/build-compiler-route/tools/tessera-opt:/usr/lib/llvm-23/bin:$PATH"
          python -m pytest tests/unit -q \
            -m "compiler_route and not hardware_apple_gpu and not hardware_nvidia and not hardware_rocm and not hardware_amx and not hardware_avx512" \
            -n auto --timeout=180 --junitxml=ci-toolchain/compiler-route-junit.xml
          python scripts/ci_require_executed.py ci-toolchain/compiler-route-junit.xml

      - name: Upload compiler toolchain and proof results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-toolchain-compiler-route-${{ github.sha }}-${{ github.run_attempt }}
          path: ci-toolchain/
          if-no-files-found: warn
          retention-days: 90

  # ────────────────────────────────────────────────────────────────────
  # Lane 3 — audit  (support_table drift + claim_lint + examples)   ~10s
  # Required check.
  # ────────────────────────────────────────────────────────────────────
  audit:
    name: audit (drift + claim_lint + examples)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install audit deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . --no-deps
          # shellcheck disable=SC2086
          python -m pip install $TESSERA_CI_PY_DEPS

      - name: Compiler plan ownership and log maintenance
        env:
          PLAN_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$PLAN_BASE_SHA" ]; then
            python scripts/check_compiler_plan.py --base "$PLAN_BASE_SHA"
          else
            python scripts/check_compiler_plan.py
          fi

      - name: Generated audit-doc drift checks
        env:
          PYTHONPATH: python
        run: bash scripts/check_generated_docs.sh

      - name: Generate revision-bound coverage evidence
        env:
          PYTHONPATH: python
        run: python scripts/coverage_evidence.py --output "$RUNNER_TEMP/coverage-evidence"

      - name: Publish coverage evidence
        uses: actions/upload-artifact@v4
        with:
          name: coverage-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/coverage-evidence/
          if-no-files-found: error
          retention-days: 90

      - name: Public-doc claim_lint
        env:
          PYTHONPATH: python
        run: python -m tessera.compiler.audit claim_lint

      # Five-surface audit (examples / benchmarks / research / tools / tests).
      # Each surface declares its entry points in
      # python/tessera/compiler/<surface>_manifest.py.  Drift gates on
      # the generated dashboards live in tests/unit/test_surface_audit.py
      # (run in the `unit` lane).  These steps execute the runnable
      # rows + check for README overclaim language.
      - name: Surface audit (examples)
        env:
          PYTHONPATH: python
        run: python -m tessera.cli.surface_audit --surface=examples --check

      - name: Surface audit (benchmarks)
        env:
          PYTHONPATH: python
        run: python -m tessera.cli.surface_audit --surface=benchmarks --check

      - name: Surface audit (research)
        env:
          PYTHONPATH: python
        run: python -m tessera.cli.surface_audit --surface=research --check

      - name: Surface audit (tools)
        env:
          PYTHONPATH: python
        run: python -m tessera.cli.surface_audit --surface=tools --check

      - name: Surface audit (tests)
        env:
          PYTHONPATH: python
        run: python -m tessera.cli.surface_audit --surface=tests --check

      - name: Surface README claim_lint (all surfaces)
        env:
          PYTHONPATH: python
        run: python -m tessera.cli.claim_lint --check

  # ────────────────────────────────────────────────────────────────────
  # LLVM/MLIR compiler-proof lanes use the exact fleet pin (23.1.1).
  # apt.llvm.org is rolling and produced 23.1.2 on GitHub while the fleet
  # remained on 23.1.1. The official release bundle is digest-checked by
  # ci_install_pinned_llvm.sh; ci_resolve_llvm.sh fails on any version drift.
  # Each lane uploads the exact toolchain record even when later proof fails.
  # ────────────────────────────────────────────────────────────────────
  # ────────────────────────────────────────────────────────────────────
  # ROCm hsaco serialization  (host-free — no GPU, no ROCm install)
  #
  # Closes the gap that let PR #619 happen: every compiled ROCm lane was
  # failing at hsaco serialization with `lld invocation failed` and nothing
  # noticed, because the only automated ROCm coverage is `check-tessera-rocm`,
  # which CI does not run.
  #
  # That outage never needed a GPU to detect. Emitting an hsaco is COMPILE-time
  # work -- MLIR's ROCDL `gpu-module-to-binary` runs `ld.lld` on the host and
  # never touches a device. Measured 2026-08-23: a HIP-less `tessera-rocm-opt`
  # serializes a real AMDGPU ELF against nothing but stock `lld-23`.
  #
  # Two things make this buildable here where `tessera-opt` is not:
  #   * `tessera-rocm-opt` is a SEPARATE executable, so it sidesteps the lean
  #     artifact driver that `TESSERA_BUILD_ROCM_BACKEND=ON` forces on
  #     `tessera-opt` (see the comment in the lit lane, and
  #     CI-LIT-BACKEND-DIALECTS-2026-08-12);
  #   * the ROCm backend's CMake has no HIP dependency.
  #
  # The pinned bundle carries the same 23.1.1 ld.lld as LLVM and MLIR.
  #
  # Coverage boundary, stated so this lane is not read as more than it is: it
  # proves the lane still PRODUCES a code object. It does not prove the object
  # runs or computes the right answer -- execution evidence needs the real
  # gfx1151 device and stays on that box (repo Decision #26). Kernels calling
  # AMD's OCML (e.g. `gelu` -> `__ocml_tanh_f32`) additionally need
  # `<ROCM_PATH>/amdgcn/bitcode`, which a stock runner lacks; that case is a
  # named, allowed skip here, and every other skip fails the lane
  # (scripts/ci_require_executed.py).
  # ────────────────────────────────────────────────────────────────────
  rocm-serialize:
    name: rocm hsaco serialization (host-free — opt-in)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Same gating as the lit lane: keeps the per-PR critical path fast while
    # still gating main. Add the `lit-smoke` label to run it on a PR. To make
    # it gate every PR instead, drop this `if:`.
    if: >-
      (github.event_name == 'workflow_dispatch')
      || (github.event_name == 'pull_request'
          && contains(github.event.pull_request.labels.*.name, 'lit-smoke'))
      || (github.event_name == 'push'
          && (github.ref == 'refs/heads/main'
              || github.ref == 'refs/heads/master'))
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install system deps and exact LLVM/MLIR 23.1.1
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list \
                     /etc/apt/sources.list.d/azure-cli.list \
                     /etc/apt/sources.list.d/azure-cli.sources 2>/dev/null || true
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build curl xz-utils
          bash scripts/ci_install_pinned_llvm.sh

      - name: Resolve exact LLVM/MLIR 23.1.1 + lld (record or fail)
        run: |
          bash scripts/ci_resolve_llvm.sh --lane rocm-serialize --require-lld \
            --manifest ci-toolchain/rocm-serialize.json

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . --no-deps
          # shellcheck disable=SC2086
          python -m pip install $TESSERA_CI_PY_DEPS

      - name: Build tessera-rocm-opt (HIP-less)
        run: |
          # A build dir of its own: ROCM_BACKEND=ON is incompatible with the
          # lit lane's core+x86 `tessera-opt` (it forces the lean driver), and
          # `tessera-rocm-opt` needs neither. This lane runs no lit suite, so
          # it configures with TESSERA_BUILD_TESTS=OFF: `tests/` requires a
          # working lit runner (cmake/TesseraLit.cmake) and fails configure
          # without one (SMALL-CORRECTNESS-GAPS-2026-09-27).
          cmake -S . -B build-rocm-ci \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DTESSERA_BUILD_TESTS=OFF \
            -DTESSERA_BUILD_ROCM_BACKEND=ON \
            -DTESSERA_ENABLE_HIP=OFF \
            -DTESSERA_ENABLE_CUDA=OFF \
            -DMLIR_DIR="$MLIR_DIR" \
            -DLLVM_DIR="$LLVM_DIR"
          cmake --build build-rocm-ci --target tessera-rocm-opt
          cp build-rocm-ci/tessera_llvm_pin.txt ci-toolchain/rocm-serialize-configure.txt

      - name: Prove the ROCm lane still emits an hsaco
        env:
          PYTHONPATH: python
        run: |
          python -m pytest tests/unit/test_rocm_hsaco_serialization.py -v -rs \
            --junitxml=ci-toolchain/rocm-serialize-junit.xml
          # A test that skips because the tool or linker is missing proved
          # nothing; only the OCML device-bitcode case may skip here.
          python scripts/ci_require_executed.py ci-toolchain/rocm-serialize-junit.xml \
            --allow-skip "no ROCm device bitcode"

      - name: Record toolchain + results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-toolchain-rocm-serialize-${{ github.sha }}-${{ github.run_attempt }}
          path: ci-toolchain/
          if-no-files-found: warn
          retention-days: 90

  lit:
    name: lit (MLIR FileCheck — opt-in)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Only run on PRs labeled `lit-smoke`, on manual dispatch, or on
    # pushes to main.  Keeps the critical path fast.
    if: >-
      (github.event_name == 'workflow_dispatch')
      || (github.event_name == 'pull_request'
          && contains(github.event.pull_request.labels.*.name, 'lit-smoke'))
      || (github.event_name == 'push'
          && (github.ref == 'refs/heads/main'
              || github.ref == 'refs/heads/master'))
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install system deps and exact LLVM/MLIR 23.1.1
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list \
                     /etc/apt/sources.list.d/azure-cli.list \
                     /etc/apt/sources.list.d/azure-cli.sources 2>/dev/null || true
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build curl xz-utils
          # FileCheck and not are test readers. MLIR, LLVM, Clang and lld come
          # from the verified 23.1.1 release bundle below.
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          codename="$(lsb_release -cs)"
          echo "deb http://apt.llvm.org/${codename}/ llvm-toolchain-${codename}-23 main" \
            | sudo tee /etc/apt/sources.list.d/llvm23.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends llvm-23-tools
          bash scripts/ci_install_pinned_llvm.sh

      - name: Resolve exact LLVM/MLIR 23.1.1 (record or fail)
        run: |
          bash scripts/ci_resolve_llvm.sh --lane lit --manifest ci-toolchain/lit.json

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . --no-deps
          # The pytest step below imports `tessera`, which eagerly pulls in
          # stdlib/es.py (-> ml_dtypes). Install the same dep set as every
          # other job instead of a hand-rolled short list, or collection
          # fails before a single MLIR proof test runs.
          # shellcheck disable=SC2086
          python -m pip install $TESSERA_CI_PY_DEPS lit FileCheck

      - name: Configure + build MLIR tools
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DTESSERA_BUILD_EXAMPLES=OFF \
            -DTESSERA_BUILD_APPLE_BACKEND=ON \
            -DTESSERA_BUILD_X86_BACKEND=ON \
            -DTESSERA_BUILD_NVIDIA_BACKEND=ON \
            -DTESSERA_BUILD_ROCM_BACKEND=ON \
            -DTESSERA_BUILD_EBM_BACKEND=ON \
            -DTESSERA_BUILD_CLIFFORD_BACKEND=ON \
            -DTESSERA_FORCE_FULL_COMPILER_DRIVER=ON \
            -DTESSERA_ENABLE_CUDA=OFF \
            -DTESSERA_ENABLE_HIP=OFF \
            -DMLIR_DIR="$MLIR_DIR" \
            -DLLVM_DIR="$LLVM_DIR"
          cp build/tessera_llvm_pin.txt ci-toolchain/lit-configure.txt
          # The Apple Target-IR dialect + lowering passes are portable MLIR
          # (only the Metal runtime .mm is Darwin-gated; Linux builds the
          # portable C++ stub), so tessera-opt registers the
          # tessera-lower-to-apple_* pipelines and the phase8 Apple lit
          # fixtures run instead of failing on an unregistered pipeline.
          #
          # X86_BACKEND is ON for the same reason: without it `TesseraX86IR`
          # never exists, tessera-opt does not register `tessera_x86`, and every
          # phase2 x86 fixture dies with "Dialect `tessera_x86' not found".
          #
          # CI explicitly requests the full compiler driver so the portable
          # Apple, NVIDIA, ROCm and x86 dialects and transformations coexist
          # without CUDA/HIP runtimes. Hardware-free artifact-only builds keep
          # the lean driver by default. This lane proves structural compiler
          # coverage; owning-device execution remains in backend evidence.
          cmake --build build --target tessera-opt tessera-translate-mlir

      - name: Run MLIR tool proof tests
        env:
          PYTHONPATH: python
          TESSERA_OPT: "${{ github.workspace }}/build/tools/tessera-opt/tessera-opt"
        run: |
          export PATH="$TESSERA_CI_LLVM_PREFIX/bin:$GITHUB_WORKSPACE/build/tools/tessera-opt:$GITHUB_WORKSPACE/build/tools/tessera-translate:/usr/lib/llvm-23/bin:$PATH"
          python -m pytest \
            tests/unit/test_cli_translate.py \
            tests/unit/test_tessera_opt_build.py \
            tests/unit/test_scheduled_attention_consumers.py::test_attention_lowers_through_one_content_addressed_tile_artifact \
            tests/unit/test_scheduled_attention_consumers.py::test_attention_modifiers_survive_the_shared_recurrence \
            tests/unit/test_scheduled_attention_consumers.py::test_attention_schedule_policy_tampering_fails_closed \
            -q -rs --junitxml=ci-toolchain/lit-proof-junit.xml
          # Every one of these skips only when a tool is missing; a skip here
          # means the build did not produce what the proofs need.
          python scripts/ci_require_executed.py ci-toolchain/lit-proof-junit.xml

      - name: Run lit smoke (TESSERA_VALIDATE_LIT=1)
        env:
          TESSERA_VALIDATE_LIT: "1"
        run: |
          export PATH="$TESSERA_CI_LLVM_PREFIX/bin:$GITHUB_WORKSPACE/build/tools/tessera-opt:$GITHUB_WORKSPACE/build/tools/tessera-translate:/usr/lib/llvm-23/bin:$PATH"
          lit tests/tessera-ir -v -o ci-toolchain/lit-results.json
          python scripts/check_lit_fleet_union.py ci-toolchain/lit-results.json

      - name: Smoke installed compiler drivers from a relocated prefix
        run: |
          cmake --install build --prefix "$RUNNER_TEMP/tessera-install" --component compiler-tools
          python scripts/check_installed_compiler.py "$RUNNER_TEMP/tessera-install" --output ci-toolchain/installed-compiler.json

      - name: Record toolchain + results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-toolchain-lit-${{ github.sha }}-${{ github.run_attempt }}
          path: ci-toolchain/
          if-no-files-found: warn
          retention-days: 90

  # ────────────────────────────────────────────────────────────────────
  # Lane 5 — sanitizer  (asan / tsan / ubsan smoke)   ~15min
  # Opt-in via PR label `sanitizer-smoke`.  Not required.
  # ────────────────────────────────────────────────────────────────────
  sanitizer:
    name: sanitizer (asan / tsan / ubsan — opt-in)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: >-
      (github.event_name == 'workflow_dispatch')
      || (github.event_name == 'pull_request'
          && contains(github.event.pull_request.labels.*.name, 'sanitizer-smoke'))
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [asan, tsan, ubsan]
    steps:
      - uses: actions/checkout@v5

      - name: Install system deps and exact LLVM/MLIR 23.1.1
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list \
                     /etc/apt/sources.list.d/azure-cli.list \
                     /etc/apt/sources.list.d/azure-cli.sources 2>/dev/null || true
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build curl xz-utils
          bash scripts/ci_install_pinned_llvm.sh

      - name: Resolve exact LLVM/MLIR 23.1.1 (record or fail)
        run: |
          bash scripts/ci_resolve_llvm.sh --lane "sanitizer-${{ matrix.sanitizer }}" \
            --manifest "ci-toolchain/sanitizer-${{ matrix.sanitizer }}.json"

      - name: Run sanitizer smoke (${{ matrix.sanitizer }})
        run: bash scripts/run_sanitizers.sh ${{ matrix.sanitizer }}

      - name: Record toolchain
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-toolchain-sanitizer-${{ matrix.sanitizer }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ci-toolchain/
          if-no-files-found: warn
          retention-days: 90

  # ────────────────────────────────────────────────────────────────────
  # Aggregator — fan-in for branch protection.
  #
  # Required GitHub status checks accept only job names, so we publish
  # a single "validate-required" check that succeeds iff every required
  # lane succeeded.  Branch protection points at this single name.
  # ────────────────────────────────────────────────────────────────────
  validate-required:
    name: validate-required
    runs-on: ubuntu-latest
    needs: [lint, unit, audit, compiler-route]
    if: always()
    steps:
      - name: Verify required lanes succeeded
        run: |
          # `needs.<job>.result` is "success", "failure", "cancelled", or "skipped".
          # We require every named lane to be "success".
          required=(
            "${{ needs.lint.result }}"
            "${{ needs.unit.result }}"
            "${{ needs.audit.result }}"
            "${{ needs.compiler-route.result }}"
          )
          fail=0
          for r in "${required[@]}"; do
            if [ "$r" != "success" ]; then
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "::error ::Required validation lane failed: lint=${{ needs.lint.result }} unit=${{ needs.unit.result }} audit=${{ needs.audit.result }} compiler-route=${{ needs.compiler-route.result }}"
            exit 1
          fi
          echo "All required lanes passed."
